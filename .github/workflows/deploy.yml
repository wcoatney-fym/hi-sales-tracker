name: Deploy backend to Supabase
# Manual only. This used to run on every push to main, but edge functions
# here are deployed one at a time after review (see PR deploy notes), and an
# automatic `supabase db push` + bulk `supabase functions deploy` would ship
# every function and migration on merge. It never got that far — db push has
# failed on migration-history drift since August — but reconciling the
# history would have made the next merge redeploy everything. Run it from the
# Actions tab when a full deploy is actually intended.
on:
  workflow_dispatch:
jobs:
  supabase-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
